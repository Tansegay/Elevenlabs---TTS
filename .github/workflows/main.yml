name: Build ElevenLabs TTS Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single EXE
        run: dotnet publish .\ElevenLabsTTS.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o .\release

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path ".\release\ElevenLabs-TTS.exe")) {
            Write-Error "EXE was not created"
            exit 1
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ElevenLabs-TTS-Windows-x64
          path: release/ElevenLabs-TTS.exe
