name: Build ElevenLabs TTS Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single EXE
        shell: pwsh
        run: |
          dotnet publish .\ElevenLabsTTS.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o .\release

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = ".\release\ElevenLabs-TTS.exe"
          if (!(Test-Path $exe)) {
            Write-Error "EXE was not created: $exe"
            exit 1
          }
          Write-Host "Created: $exe"
          Get-Item $exe | Select-Object Name, Length, FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ElevenLabs-TTS-Windows-x64
          path: release/ElevenLabs-TTS.exe
          if-no-files-found: error
